name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (uploaded via mobile browser)
        run: |
          if [ -f SpriteUpscaler.zip ]; then
            unzip -o SpriteUpscaler.zip -d .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download bundled ESRGAN model
        run: |
          mkdir -p SpriteUpscaler/app/src/main/assets
          curl -sL -o /tmp/esrgan.tar.gz "https://github.com/margaretmz/esrgan-e2e-tflite-tutorial/releases/download/v0.1.0/esrgan_fp16.tar.gz"
          tar xzf /tmp/esrgan.tar.gz -C /tmp
          cp /tmp/esrgan_fp16.tflite SpriteUpscaler/app/src/main/assets/esrgan.tflite
          ls -la SpriteUpscaler/app/src/main/assets

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK
        working-directory: SpriteUpscaler
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprite-upscaler-debug-apk
          path: SpriteUpscaler/app/build/outputs/apk/debug/app-debug.apk
